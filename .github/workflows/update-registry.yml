name: Registry Update

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run full pipeline
        run: npm run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing themes.json
        id: check-existing
        run: |
          if [ -f artifacts/themes.json ]; then
            cp artifacts/themes.json artifacts/themes.json.old
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate top 50 themes file
        id: top-themes
        run: |
          node -e "
            const fs = require('fs');
            const themes = JSON.parse(fs.readFileSync('artifacts/themes.json', 'utf-8'));
            
            // Sort by stars (descending), filter out builtins for ranking
            const ranked = themes
              .filter(t => t.repo && t.stars)
              .sort((a, b) => (b.stars || 0) - (a.stars || 0))
              .slice(0, 50);
            
            // Get top 50 with all their variants
            const topNames = new Set(ranked.map(t => t.name));
            const topThemes = themes.filter(t => topNames.has(t.name));
            
            fs.writeFileSync('artifacts/themes-top-50.json', JSON.stringify(topThemes, null, 2));
            console.log('Generated themes-top-50.json with', topThemes.length, 'themes');
          "
          echo "count=$(jq 'length' artifacts/themes-top-50.json)" >> $GITHUB_OUTPUT

      - name: Check if themes.json changed
        id: check-changes
        run: |
          if [ "${{ steps.check-existing.outputs.exists }}" == "true" ]; then
            if diff -q artifacts/themes.json artifacts/themes.json.old > /dev/null 2>&1; then
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate release tag
        if: steps.check-changes.outputs.changed == 'true'
        id: tag
        run: echo "value=registry-$(date -u +%Y-%m-%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check-changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.tag.outputs.value }} \
            --title "Registry Update ${{ steps.tag.outputs.value }}" \
            --notes "Automated registry update" \
            artifacts/themes.json \
            artifacts/themes-top-50.json \
            artifacts/manifest.json

      - name: Update plugin submodule
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          cp artifacts/themes-top-50.json theme-browser.nvim/lua/theme-browser/data/registry.json
          git -C theme-browser.nvim add -A
          git -C theme-browser.nvim commit -m "chore: update bundled registry (top 50 themes)"
          git -C theme-browser.nvim push

      - name: Summary - No changes
        if: steps.check-changes.outputs.changed == 'false'
        run: echo "::notice::No changes detected in themes.json - skipping release"
