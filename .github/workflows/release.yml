name: Release

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - stable

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Run pipeline
        run: go run ./cmd/registry pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get package version
        id: version
        run: echo "value=$(cat internal/version/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check if artifacts changed
        id: check-changes
        run: |
          if git diff --quiet artifacts/themes.json artifacts/themes-top-50.json artifacts/manifest.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "value=latest" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.channel || 'latest' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release tag
        if: steps.check-changes.outputs.changed == 'true'
        id: tag
        run: |
          VERSION="v${{ steps.version.outputs.value }}"
          CHANNEL="${{ steps.channel.outputs.value }}"
          if [ "$CHANNEL" = "stable" ]; then
            echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "value=${VERSION}+$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update channel release
        if: steps.check-changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          CHANNEL="${{ steps.channel.outputs.value }}"
          THEME_COUNT="$(jq -r '.count' artifacts/manifest.json)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating $CHANNEL release $TAG"
            if [ "$CHANNEL" = "latest" ]; then
              gh release edit "$TAG" --prerelease
            else
              gh release edit "$TAG" --latest
            fi
            gh release upload "$TAG" \
              artifacts/themes.json \
              artifacts/themes-top-50.json \
              artifacts/manifest.json \
              --clobber
          else
            echo "Creating $CHANNEL release $TAG"
            if [ "$CHANNEL" = "latest" ]; then
              gh release create "$TAG" \
                --prerelease \
                --title "Registry latest $TAG" \
                --notes "Automated latest registry update with ${THEME_COUNT} themes" \
                artifacts/themes.json \
                artifacts/themes-top-50.json \
                artifacts/manifest.json
            else
              gh release create "$TAG" \
                --latest \
                --title "Registry stable $TAG" \
                --notes "Automated stable registry update with ${THEME_COUNT} themes" \
                artifacts/themes.json \
                artifacts/themes-top-50.json \
                artifacts/manifest.json
            fi
          fi
