name: Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test -- --exclude "tests/e2e/**"

      - name: Build TypeScript
        run: pnpm build

      - name: Run pipeline
        run: pnpm pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate manifest
        run: pnpm task:manifest

      - name: Generate top 50 themes file
        run: pnpm task:top50

      - name: Get package version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if artifacts changed
        id: check-changes
        run: |
          if git diff --quiet artifacts/themes.json artifacts/themes-top-50.json artifacts/manifest.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate timestamped release tag
        if: steps.check-changes.outputs.changed == 'true'
        id: tag
        run: echo "value=registry-$(date -u +%Y-%m-%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Create timestamped GitHub Release
        if: steps.check-changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          THEME_COUNT="$(node -p "require('./artifacts/manifest.json').count")"

          gh release create "$TAG" \
            --title "Registry Update $TAG" \
            --notes "Automated registry update with ${THEME_COUNT} themes" \
            artifacts/themes.json \
            artifacts/themes-top-50.json \
            artifacts/manifest.json

      - name: Create or update versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.version.outputs.value }}"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Updating versioned release $VERSION"
            gh release upload "$VERSION" \
              artifacts/themes.json \
              artifacts/themes-top-50.json \
              artifacts/manifest.json \
              --clobber
          else
            echo "Creating versioned release $VERSION"
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              artifacts/themes.json \
              artifacts/themes-top-50.json \
              artifacts/manifest.json
          fi
